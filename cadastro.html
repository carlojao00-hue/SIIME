<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <link rel="stylesheet" href="../../css/cadastro.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro SIIME</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
</style>
</head>
<body>
    <header>
        <h1>Cadastro no SIIME</h1>
        <h3>Você poderá editar seu perfil médico a qualquer momento após o cadastro.</H3>
    </header>
    <main>
        <section>
            <h2 class="sobre-link">Para saber mais sobre o SIIME, clique <a href="sobre.html">aqui</a>.</h2>
            <h2>Crie seu Perfil Médico</h2>
            
            <form action="/submit" method="post">
                <label for="name"> <span style="color: red;">*</span> Nome Completo:</label><br>
                <input type="text" id="name" name="name" placeholder="Digite Seu Nome Completo" required><br><br>

                <label for ="CPF"> <span style="color: red;">*</span> CPF:</label><br>
                <input type="text" id="CPF" name="CPF" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" required><br><br>

                <label for="data"> <span style="color: red;">*</span> Data de Nascimento:</label><br>
                <input type="date" id="data" name="data" required><br><br>

                <label for="allergies">Alergias:</label><br>
                <textarea id="allergies" name="allergies" placeholder="Descreva suas alergias"></textarea><br><br>

                <label for="conditions">Condições Médicas:</label><br>
                <textarea id="conditions" name="conditions" placeholder="Descreva suas condições médicas"></textarea><br><br>

                <label for="medications">Medicamentos em Uso:</label><br>
                <textarea id="medications" name="medications" placeholder="Descreva os medicamentos que você está tomando"></textarea><br><br>

                <label for="emergency_contact">Contato de Emergência:</label><br>
                <input type="text" id="emergency_contact_name" name="emergency_contact_name" placeholder="Nome do Contato "><br><br>
                <input type="number" id="emergency_contact_phone" name="emergency_contact_phone" placeholder="Telefone do Contato "><br><br>

                <label for="blood_type"> <span style="color: red;">*</span> Tipo Sanguíneo:</label><br>
                <input type="text" id="blood_type" name="blood_type" placeholder="Digite seu tipo sanguíneo" required><br><br>

                <label for="Password"> <span style="color: red;">*</span>Senha:</label><br>
                <input type="password" id="Password" name="Password" placeholder="Crie uma senha" required><br><br>

                <label for="Confirmar Password"> <span style="color: red;">*</span> Confirmar Senha:</label><br>
                <input type="password" id="Confirmar Password" name="Confirmar Password" placeholder="Confirme sua senha" required><br><br>

                <input type="submit" value="Confirmar Cadastro">
                <p>Já possui cadastro? <a href="login.html">faça login</a></p>
                
            </form>
        </section>
    </main>
    <script type="module" src="../../js/cadastro.js"></script>
</body>
</html>
