<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ficha Médica</title>
    <link rel="stylesheet" href="../../css/editar-ficha.css">
</head>
<body>
    <main>
        <aside class="sidebar">
            <h1>SIIME</h1>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Inicio</a></li>
                    <li><a href="exames-consul.html">Exames e Consultas</a></li>
                    <li><a href="ficha-completa.html">Minha Ficha</a></li>
                    <li><a href="qr-emergencia.html">QR Emergência</a></li>
                    <li><a href="login.html">Sair</a></li>
                </ul>
            </nav>
        </aside>

        <section class="content">
            <div class="editar-wrapper">
                <section class="header">
                    <h2>Editar suas Informações</h2>
                    <p>Atualize seus dados médicos sempre que necessário.</p>
                </section>

                <form id="editarForm">
                    <div class="form-group">
                        <label for="name">Nome Completo:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="CPF">CPF:</label>
                        <input type="text" id="CPF" name="CPF" disabled>
                        <small>CPF não pode ser alterado</small>
                    </div>

                    <div class="form-group">
                        <label for="data">Data de Nascimento:</label>
                        <input type="date" id="data" name="data" required>
                    </div>

                    <div class="form-group">
                        <label for="blood_type">Tipo Sanguíneo:</label>
                        <input type="text" id="blood_type" name="blood_type" required>
                    </div>

                    <div class="form-group">
                        <label for="allergies">Alergias:</label>
                        <textarea id="allergies" name="allergies" placeholder="Descreva suas alergias"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="conditions">Condições Médicas:</label>
                        <textarea id="conditions" name="conditions" placeholder="Descreva suas condições médicas"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="medications">Medicamentos em Uso:</label>
                        <textarea id="medications" name="medications" placeholder="Descreva os medicamentos que você está tomando"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="emergency_contact_name">Nome do Contato de Emergência:</label>
                        <input type="text" id="emergency_contact_name" name="emergency_contact_name">
                    </div>

                    <div class="form-group">
                        <label for="emergency_contact_phone">Telefone do Contato de Emergência:</label>
                        <input type="number" id="emergency_contact_phone" name="emergency_contact_phone">
                    </div>

                    <div class="form-group">
                        <label for="Password">Nova Senha (deixe em branco para não alterar):</label>
                        <input type="password" id="Password" name="Password">
                    </div>

                    <div class="form-group">
                        <label for="ConfirmarPassword">Confirmar Nova Senha:</label>
                        <input type="password" id="ConfirmarPassword" name="ConfirmarPassword">
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-save">Salvar Alterações</button>
                        <button type="button" class="btn-cancel" onclick="window.location.href='dashboard.html'">Cancelar</button>
                    </div>

                    <p id="msg" class="message"></p>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="../../js/editar-ficha.js"></script>
</body>
</html>
